name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/rchaicowski/budget-tracker-api:latest
            ghcr.io/rchaicowski/budget-tracker-api:${{ github.sha }}

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io/rchaicowski/budget-tracker-api:latest
            docker stop budget-tracker-api || true
            docker rm budget-tracker-api || true
            docker run -d --name budget-tracker-api \
              --network host \
              --restart unless-stopped \
              -e "ASPNETCORE_URLS=http://+:5000" \
              -e "ConnectionStrings__DefaultConnection=${{ secrets.DB_CONNECTION_STRING }}" \
              -e "Jwt__Key=${{ secrets.JWT_KEY }}" \
              -e "Jwt__Issuer=BudgetTrackerApi" \
              -e "Jwt__Audience=BudgetTrackerUsers" \
              ghcr.io/rchaicowski/budget-tracker-api:latest
