name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore BudgetTrackerApi/BudgetTrackerApi.csproj
          dotnet restore BudgetTrackerApi.Tests/BudgetTrackerApi.Tests.csproj

      - name: Build
        run: |
          dotnet build BudgetTrackerApi/BudgetTrackerApi.csproj --no-restore --configuration Release
          dotnet build BudgetTrackerApi.Tests/BudgetTrackerApi.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test BudgetTrackerApi.Tests/BudgetTrackerApi.Tests.csproj --no-build --configuration Release
